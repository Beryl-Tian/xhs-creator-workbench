[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-creator-workbench"
version = "0.1.0.dev0"
description = "Local-first Xiaohongshu creator analysis and branded-content workbench"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "BerylTian" }]
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7"]
keywords = ["codex", "creator-workflow", "local-first", "xiaohongshu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Beryl-Tian/xhs-creator-workbench"
Repository = "https://github.com/Beryl-Tian/xhs-creator-workbench"
Issues = "https://github.com/Beryl-Tian/xhs-creator-workbench/issues"
Security = "https://github.com/Beryl-Tian/xhs-creator-workbench/security/policy"

[project.scripts]
xhs-agent = "xhs_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xhs_agent.renderers.assets" = ["*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

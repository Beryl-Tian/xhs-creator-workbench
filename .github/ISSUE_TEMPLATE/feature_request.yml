name: Feature request
description: 提议新的使用场景或改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请描述需要解决的问题，不要提交真实博主、品牌、项目或凭据信息。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流中的困难和使用场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、人工确认节点和可能的数据影响。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已使用抽象或合成示例，没有提交真实业务数据或凭据。
          required: true
